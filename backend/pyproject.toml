[project]
name = "astra-multi"
version = "0.1.0"
description = "Multi-LLM collaborative software design planning"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4,<1.0",
    "langgraph-checkpoint-sqlite>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "keyring==25.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff==0.13.0",
    "mypy==1.18.2",
]
providers = [
    "openai==1.109.1",
    "google-genai==1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_multi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/astra_multi/domain", "src/astra_multi/persistence", "src/astra_multi/persistence_demo.py", "src/astra_multi/credentials.py", "src/astra_multi/provider_config.py", "src/astra_multi/provider_cli.py", "src/astra_multi/provider_smoke.py", "src/astra_multi/providers.py", "src/astra_multi/context", "src/astra_multi/tools", "src/astra_multi/sandbox", "src/astra_multi/gateway", "src/astra_multi/p2_demo.py", "tests/unit/test_snapshots.py", "tests/unit/test_tool_broker.py", "tests/unit/test_gateway.py", "tests/integration/test_evidence_context.py", "tests/integration/test_sandbox.py"]
