[project]
name = "astra-multi"
version = "0.1.0"
description = "Multi-LLM collaborative software design planning"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4,<1.0",
    "langgraph-checkpoint-sqlite>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
providers = [
    "openai>=1.0,<2.0",
    "google-genai>=1.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra_multi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
